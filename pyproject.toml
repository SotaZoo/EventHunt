[project]
name = "nyc-ai-events"
version = "0.3.17"
description = "Collect and rank events from multiple sources"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joey Yu" }]
license = { text = "MIT" }
dependencies = [
    "playwright>=1.48.0",
    "crawl4ai>=0.4.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "jinja2>=3.1",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "rich>=15.0.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.14,<5",
    "markdown-it-py>=4,<5",
    "starlette>=1.0.0",
    "uvicorn>=0.46.0",
    "python-multipart>=0.0.27",
    "itsdangerous>=2.2.0",
    "authlib>=1.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "discord.py>=2.4",
    "mcp>=2.2,<3",
    "supabase>=2.27,<3",
    "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.5",
    "pytest-httpx>=0.30",
]

[project.scripts]
nyc-ai-scout = "api.commands.main:app"
nyc-ai = "api.commands.main:app"   # deprecated alias, kept for one release

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
    "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist/discovery" = "api/_runtime/web"
"db/migrate" = "api/_runtime/db/migrate"
"deploy" = "api/_runtime/deploy"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/dist",
    "/scratch",
    "/data",
    "/web/node_modules",
    "/web/.next",
    "/e2e/node_modules",
]

[tool.hatch.build.targets.sdist.force-include]
"web/dist/discovery" = "web/dist/discovery"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
